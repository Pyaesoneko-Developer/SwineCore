<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <title>Analytics | SwineCore</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" th:href="@{/css/main.css}" />

    <style>
        .analytics-card {
            border: 0;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, .08);
            overflow: hidden;
        }

        .analytics-row {
            align-items: stretch;
        }

        .analytics-chart-card,
        .attendance-card {
            height: 100%;
        }

        .analytics-chart-card .card-body {
            min-height: 535px;
            display: flex;
            flex-direction: column;
        }

        .analytics-chart-wrap {
            position: relative;
            width: 100%;
            flex: 1;
            min-height: 485px;
        }

        .attendance-search {
            height: 42px;
            border-radius: 12px;
            max-width: 260px;
        }

        .attendance-table th,
        .attendance-table td {
            vertical-align: middle;
            white-space: nowrap;
            padding: .85rem;
        }

        .attendance-pagination-footer {
            padding: 1rem;
        }

        .attendance-pagination-info {
            text-align: center;
            margin-bottom: .75rem;
        }

        .attendance-pagination {
            display: flex;
            gap: .45rem;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 0;
        }

        .attendance-pagination .page-item .page-link {
            min-width: 40px;
            height: 40px;
            padding: 0 12px;
            border-radius: 12px;
            border: 1px solid #d7e7dc;
            background: #ffffff;
            color: #198754;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            box-shadow: none;
            cursor: pointer;
        }

        .attendance-pagination .page-item.active .page-link {
            background: #198754;
            border-color: #198754;
            color: #ffffff;
        }

        .attendance-pagination .page-item.disabled .page-link {
            background: #f8f9fa;
            border-color: #e9ecef;
            color: #9aa4ad;
            pointer-events: none;
        }

        @media (max-width: 768px) {
            .attendance-card-header {
                flex-direction: column;
                align-items: stretch !important;
                gap: 1rem;
            }

            .attendance-search {
                max-width: none;
                width: 100%;
            }

            .analytics-chart-card .card-body {
                min-height: 360px;
            }

            .analytics-chart-wrap {
                min-height: 320px;
            }
        }
    </style>
</head>

<body class="d-flex">
    <th:block th:replace="~{layout/base :: sidebar}"></th:block>

    <div id="main-content" class="flex-grow-1 p-4 overflow-auto">
        <th:block th:replace="~{layout/base :: alerts}"></th:block>

        <h2 class="fw-bold mb-4">
            <i class="bi bi-bar-chart-line me-2 text-success"></i>
            Farm Analytics
        </h2>

        <div class="row g-3 analytics-row">
            <!-- Monthly Income vs Expense Graph -->
            <div class="col-md-7">
                <div class="card analytics-card analytics-chart-card">
                    <div class="card-header bg-transparent fw-semibold">
                        <i class="bi bi-graph-up-arrow me-2 text-success"></i>
                        Monthly Income vs Expense
                    </div>

                    <div class="card-body">
                        <div th:if="${financials == null || financials.isEmpty()}" class="text-center text-muted py-5">
                            <i class="bi bi-inbox fs-1 d-block mb-2"></i>
                            No financial data found.
                        </div>

                        <div th:if="${financials != null && !financials.isEmpty()}" class="analytics-chart-wrap">
                            <canvas id="finChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Staff Attendance -->
            <div class="col-md-5">
                <div class="card analytics-card attendance-card">
                    <div
                        class="card-header bg-transparent d-flex justify-content-between align-items-center gap-2 attendance-card-header">
                        <div>
                            <h6 class="fw-bold mb-0">
                                <i class="bi bi-calendar-check me-2 text-success"></i>
                                Staff Attendance
                            </h6>

                            <small class="text-muted">
                                Last 30 Days —
                                Total:
                                <span th:text="${attendance != null ? #maps.size(attendance) : 0}">0</span>
                            </small>
                        </div>

                        <input type="text" id="attendanceSearchInput" class="form-control attendance-search"
                            placeholder="Search staff..." />
                    </div>

                    <div th:if="${attendance == null || #maps.isEmpty(attendance)}" class="text-center text-muted py-5">
                        <i class="bi bi-inbox fs-1 d-block mb-2"></i>
                        No attendance data found.
                    </div>

                    <div th:if="${attendance != null && !#maps.isEmpty(attendance)}" class="table-responsive">

                        <table class="table table-hover mb-0 attendance-table" id="attendanceTable"
                            data-no-live-search="true">

                            <thead class="table-light">
                                <tr>
                                    <th>#</th>
                                    <th>Staff</th>
                                    <th>Days Attended</th>
                                </tr>
                            </thead>

                            <tbody>
                                <tr th:each="entry : ${attendance}" class="attendance-row">
                                    <td class="attendance-row-number">1.</td>

                                    <td class="fw-semibold" th:text="${entry.key}">
                                        Staff
                                    </td>

                                    <td>
                                        <span class="badge bg-success rounded-pill" th:text="${entry.value}">
                                            0
                                        </span>
                                    </td>
                                </tr>

                                <tr id="attendanceNoResultRow" class="d-none">
                                    <td colspan="3" class="text-center text-muted py-4">
                                        <i class="bi bi-search me-2"></i>
                                        No attendance records match your search.
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div th:if="${attendance != null && !#maps.isEmpty(attendance)}"
                        class="card-footer bg-transparent attendance-pagination-footer">

                        <div class="text-muted small attendance-pagination-info" id="attendancePaginationInfo">
                            Showing 0 to 0 of 0 attendance records
                        </div>

                        <nav aria-label="Attendance pagination">
                            <ul class="pagination attendance-pagination" id="attendancePagination"></ul>
                        </nav>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
    <script th:src="@{/js/main.js}"></script>

    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function () {
            /*
             * Monthly Income vs Expense Chart
             */
            const chartCanvas = document.getElementById('finChart');

            if (chartCanvas && window.Chart) {
                const cs = getComputedStyle(document.documentElement);
                const greenColor = cs.getPropertyValue('--brand-gradient-start').trim() || '#198754';
                const dangerColor = cs.getPropertyValue('--danger').trim() || '#dc2626';

                const fin = /*[[${financials != null ? financials : {}}]]*/ {};
                const labels = Object.keys(fin || {});

                const income = labels.map(function (key) {
                    return fin[key] && fin[key].income ? Number(fin[key].income) : 0;
                });

                const expense = labels.map(function (key) {
                    return fin[key] && fin[key].expense ? Number(fin[key].expense) : 0;
                });

                if (labels.length > 0) {
                    new Chart(chartCanvas, {
                        type: 'bar',
                        data: {
                            labels: labels,
                            datasets: [
                                {
                                    label: 'Income',
                                    data: income,
                                    backgroundColor: greenColor,
                                    borderRadius: 8
                                },
                                {
                                    label: 'Expense',
                                    data: expense,
                                    backgroundColor: dangerColor,
                                    borderRadius: 8
                                }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            interaction: {
                                mode: 'index',
                                intersect: false
                            },
                            plugins: {
                                legend: {
                                    position: 'bottom'
                                },
                                tooltip: {
                                    callbacks: {
                                        label: function (context) {
                                            const value = Number(context.raw || 0);
                                            return context.dataset.label + ': ' + value.toLocaleString() + ' MMK';
                                        }
                                    }
                                }
                            },
                            scales: {
                                y: {
                                    beginAtZero: true,
                                    ticks: {
                                        callback: function (value) {
                                            return Number(value).toLocaleString() + ' MMK';
                                        }
                                    }
                                }
                            }
                        }
                    });
                }
            }

            /*
             * Staff Attendance Pagination + Search
             * 8 rows per page to match graph height.
             */
            const rows = Array.from(document.querySelectorAll('.attendance-row'));
            const searchInput = document.getElementById('attendanceSearchInput');
            const noResultRow = document.getElementById('attendanceNoResultRow');
            const pagination = document.getElementById('attendancePagination');
            const paginationInfo = document.getElementById('attendancePaginationInfo');

            const pageSize = 7;
            let currentPage = 1;
            let filteredRows = [];

            function rowMatchesSearch(row) {
                const query = searchInput ? searchInput.value.trim().toLowerCase() : '';
                return !query || row.innerText.toLowerCase().includes(query);
            }

            function calculateFilteredRows() {
                filteredRows = rows.filter(rowMatchesSearch);
            }

            function renderRows() {
                rows.forEach(function (row) {
                    row.style.display = 'none';
                });

                const total = filteredRows.length;
                const totalPages = Math.max(1, Math.ceil(total / pageSize));

                if (currentPage > totalPages) {
                    currentPage = totalPages;
                }

                const startIndex = (currentPage - 1) * pageSize;
                const endIndex = Math.min(startIndex + pageSize, total);

                filteredRows.slice(startIndex, endIndex).forEach(function (row, index) {
                    row.style.display = '';

                    const numberCell = row.querySelector('.attendance-row-number');
                    if (numberCell) {
                        numberCell.textContent = (startIndex + index + 1) + '.';
                    }
                });

                if (noResultRow) {
                    noResultRow.classList.toggle('d-none', total > 0);
                }

                if (paginationInfo) {
                    paginationInfo.textContent = total === 0
                        ? 'Showing 0 to 0 of 0 attendance records'
                        : 'Showing ' + (startIndex + 1) + ' to ' + endIndex + ' of ' + total + ' attendance records';
                }

                renderPagination(totalPages);
            }

            function createPageItem(label, disabled, active, clickHandler) {
                const li = document.createElement('li');
                li.className = 'page-item'
                    + (disabled ? ' disabled' : '')
                    + (active ? ' active' : '');

                const btn = document.createElement('button');
                btn.className = 'page-link';
                btn.type = 'button';
                btn.innerHTML = label;

                if (!disabled && typeof clickHandler === 'function') {
                    btn.addEventListener('click', clickHandler);
                }

                li.appendChild(btn);
                return li;
            }

            function renderPagination(totalPages) {
                if (!pagination) {
                    return;
                }

                pagination.innerHTML = '';

                if (filteredRows.length <= pageSize) {
                    return;
                }

                pagination.appendChild(createPageItem('<i class="bi bi-chevron-left"></i>', currentPage === 1, false, function () {
                    currentPage--;
                    renderRows();
                }));

                for (let i = 1; i <= totalPages; i++) {
                    if (i === 1 || i === totalPages || Math.abs(i - currentPage) <= 2) {
                        pagination.appendChild(createPageItem(String(i), false, i === currentPage, function () {
                            currentPage = i;
                            renderRows();
                        }));
                    } else if (i === currentPage - 3 || i === currentPage + 3) {
                        pagination.appendChild(createPageItem('...', true, false, null));
                    }
                }

                pagination.appendChild(createPageItem('<i class="bi bi-chevron-right"></i>', currentPage === totalPages, false, function () {
                    currentPage++;
                    renderRows();
                }));
            }

            function applySearch(resetPage) {
                if (resetPage) {
                    currentPage = 1;
                }

                calculateFilteredRows();
                renderRows();
            }

            if (searchInput) {
                searchInput.addEventListener('input', function () {
                    applySearch(true);
                });
            }

            applySearch(true);
        });
    </script>
</body>

</html>
