<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/>
<title>Shift Configuration | SwineCore</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
<link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body class="d-flex">
<th:block th:replace="~{layout/base :: sidebar}"></th:block>
<div id="main-content" class="flex-grow-1 p-4 overflow-auto">
    <th:block th:replace="~{layout/base :: alerts}"></th:block>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0"><i class="bi bi-clock-history me-2 text-primary"></i>Shift Configuration & Staff Assignment</h2>
        <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#createShiftModal">
            <i class="bi bi-plus-circle me-2"></i>New Shift
        </button>
    </div>

    <div class="card border-warning mb-4"><div class="card-header fw-semibold">Supervisor Early Clock-out Requests</div><div class="table-responsive"><table class="table align-middle mb-0">
        <thead><tr><th>Supervisor</th><th>Building</th><th>Reason</th><th>Status</th><th></th></tr></thead><tbody>
        <tr th:each="a : ${pendingClockOuts}"><td th:text="${a.user.fullName}"></td><td th:text="${a.user.building != null ? a.user.building.name : '-'}"></td><td th:text="${a.earlyDepartureReason}"></td><td><span class="badge bg-warning text-dark">Still Clocked In</span></td><td><form th:action="@{/manager/attendance/__${a.id}__/approve-clock-out}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/><button class="btn btn-success btn-sm">Confirm Clock-out</button></form></td></tr>
        <tr th:if="${#lists.isEmpty(pendingClockOuts)}"><td colspan="5" class="text-center text-muted">No pending supervisor requests.</td></tr>
        </tbody></table></div></div>

    <div class="card glass-card border-0">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr><th>Name</th><th>Start Time</th><th>End Time</th><th>Assigned Staff</th><th>Actions</th></tr>
                </thead>
                <tbody>
                <tr th:each="s : ${shifts}">
                    <td class="fw-semibold" th:text="${s.name}"></td>
                    <td th:text="${s.standardStart}"></td>
                    <td th:text="${s.standardEnd}"></td>
                    <td>
                        <span class="badge bg-info me-1" th:each="u : ${assignedUsersByShift[s.id]}" th:text="${u.fullName}"></span>
                        <span th:if="${#lists.isEmpty(assignedUsersByShift[s.id])}" class="text-muted small">None</span>
                    </td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary me-1" data-bs-toggle="modal"
                                th:data-bs-target="'#assignModal' + ${s.id}">
                            <i class="bi bi-person-plus"></i> Assign
                        </button>
                        <form th:action="@{/manager/shifts/__${s.id}__/delete}" method="post" class="d-inline"
                              onsubmit="return confirm('Delete this shift?')">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(shifts)}">
                    <td colspan="5" class="text-muted text-center py-4">No shifts configured. Create one to get started.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Create Shift Modal -->
    <div class="modal fade" id="createShiftModal" tabindex="-1">
        <div class="modal-dialog"><div class="modal-content glass-modal">
            <div class="modal-header border-0">
                <h5 class="modal-title fw-bold"><i class="bi bi-clock me-2"></i>Create New Shift</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form th:action="@{/manager/shifts/create}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Shift Name</label>
                        <input type="text" name="name" class="form-control" placeholder="e.g., Morning Shift" required/>
                    </div>
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Start Time</label>
                            <input type="time" name="standardStart" class="form-control" required/>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">End Time</label>
                            <input type="time" name="standardEnd" class="form-control" required/>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-success w-100"><i class="bi bi-check-circle me-2"></i>Create Shift</button>
                </form>
            </div>
        </div></div>
    </div>

    <!-- Assign Staff Modals -->
    <th:block th:each="s : ${shifts}">
        <div class="modal fade" th:id="'assignModal' + ${s.id}" tabindex="-1">
            <div class="modal-dialog"><div class="modal-content glass-modal">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-bold"><i class="bi bi-person-plus me-2"></i>Assign Staff to <span th:text="${s.name}"></span></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form th:action="@{/manager/shifts/__${s.id}__/assign}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Select Staff Member</label>
                            <select name="userId" class="form-select" required>
                                <option value="">-- Select Staff --</option>
                                <option th:each="u : ${allStaff}" th:value="${u.id}" th:text="${u.fullName + ' (' + u.role + ')'}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Effective Date</label>
                            <input type="date" name="effectiveDate" class="form-control" required/>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Assign Staff</button>
                    </form>
                </div>
            </div></div>
        </div>
    </th:block>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
