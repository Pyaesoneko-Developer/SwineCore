<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/>
<title th:text="${farm.name} + ' | SwineCore'">Farm Detail</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
<link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body class="d-flex">
<th:block th:replace="~{layout/base :: sidebar}"></th:block>
<div id="main-content" class="flex-grow-1 p-4 overflow-auto">
    <th:block th:replace="~{layout/base :: alerts}"></th:block>
    <div class="d-flex align-items-center mb-4">
        <a th:href="@{/admin/farms}" class="btn btn-sm btn-outline-secondary me-3"><i class="bi bi-arrow-left"></i></a>
        <div>
            <h2 class="fw-bold mb-0" th:text="${farm.name}"></h2>
            <code class="text-muted" th:text="'Code: ' + ${farm.code}"></code>
        </div>
    </div>

    <div class="card mt-3" style="max-width:620px" data-erp-create-panel="Create Building"><div class="card-header fw-semibold">Create Building</div><div class="card-body">
        <form th:action="@{/admin/farms/__${farm.id}__/buildings/create}" method="post" class="row g-2">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="col-md-8"><input name="name" class="form-control" placeholder="e.g. Breeding Building" required/></div>
            <div class="col-md-4"><button class="btn btn-success w-100"><i class="bi bi-plus-circle me-1"></i>Create Building</button></div>
            <div class="col-12"><small class="text-muted"><i class="bi bi-magic me-1"></i>Building code is generated automatically.</small></div>
        </form>
    </div></div>

    <div class="row g-3">
        <!-- Buildings -->
        <div class="col-md-7">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-header bg-transparent fw-semibold d-flex justify-content-between">
                    <span><i class="bi bi-buildings me-2"></i>Buildings (<span th:text="${buildings.size()}"></span>)</span>
                </div>
                <div class="card-body p-0">
                    <table class="table table-hover mb-0">
                        <thead class="table-light"><tr><th>Name</th><th>Code</th><th>Supervisor</th></tr></thead>
                        <tbody>
                        <tr th:each="b : ${buildings}">
                            <td th:text="${b.name}"></td>
                            <td><code th:text="${b.code}"></code></td>
                            <td th:text="${b.currentSupervisor != null ? b.currentSupervisor.fullName : 'Unassigned'}"></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(buildings)}">
                            <td colspan="3" class="text-muted text-center">No buildings.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Staff -->
        <div class="col-md-5">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-header bg-transparent fw-semibold"><i class="bi bi-people me-2"></i>Staff</div>
                <div class="card-body p-0">
                    <table class="table table-hover mb-0">
                        <thead class="table-light"><tr><th>Name</th><th>Role</th></tr></thead>
                        <tbody>
                        <tr th:each="u : ${staff}">
                            <td th:text="${u.fullName}"></td>
                            <td><span class="badge bg-secondary" th:text="${u.role}"></span></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Assign Manager -->
    <div class="card border-0 shadow-sm mt-3" style="max-width:500px;">
        <div class="card-header bg-transparent fw-semibold">Assign Manager to Farm</div>
        <div class="card-body">
            <form th:action="@{/admin/farms/__${farm.id}__/assign-manager}" method="post" class="d-flex gap-2">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <select name="userId" class="form-select" required>
                    <th:block th:each="u : ${staff}">
                        <option th:if="${u.role.name() == 'MANAGER'}" th:value="${u.id}" th:text="${u.fullName}"></option>
                    </th:block>
                </select>
                <button type="submit" class="btn btn-primary text-nowrap">Assign</button>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
