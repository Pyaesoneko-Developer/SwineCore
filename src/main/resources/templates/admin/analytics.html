<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <title>Analytics | SwineCore</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" th:href="@{/css/main.css}" />

    <style>
        .analytics-page .live-search,
        .analytics-page .table-search,
        .analytics-page input[type="search"],
        .analytics-page input[placeholder="Search this list..."] {
            display: none !important;
        }

        .pig-chart-wrap {
            max-width: 420px;
            height: 420px;
            margin: 0 auto;
        }

        .pig-chart-wrap canvas {
            max-width: 100%;
            max-height: 100%;
        }
    </style>
</head>

<body class="d-flex">

    <th:block th:replace="~{layout/base :: sidebar}"></th:block>

    <div id="main-content" class="flex-grow-1 p-4 overflow-auto analytics-page">

        <h2 class="fw-bold mb-4">
            <i class="bi bi-bar-chart-line me-2 text-success"></i>
            Analytics
        </h2>

        <div class="row g-3">
            <div class="col-md-6">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-transparent fw-semibold">
                        Summary
                    </div>

                    <div class="card-body">
                        <table class="table mb-0" data-no-live-search="true">
                            <tr th:each="entry : ${summary}">
                                <th class="text-muted fw-normal" th:text="${entry.key}"></th>
                                <td class="fw-bold" th:text="${entry.value}"></td>
                            </tr>
                        </table>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-transparent fw-semibold">
                        Pig Distribution by Farm
                    </div>

                    <div class="card-body">
                        <p class="text-muted small">
                            Shows the number of active pigs in each farm.
                            Sold and deceased pigs are excluded.
                            Click a chart section to open that farm.
                        </p>

                        <div class="pig-chart-wrap">
                            <canvas id="pigDistChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>

    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('.analytics-page input[placeholder="Search this list..."]').forEach(function (input) {
                const wrapper = input.closest('.mb-3, .d-flex, .input-group, div');
                if (wrapper) {
                    wrapper.remove();
                } else {
                    input.remove();
                }
            });

            const chartCanvas = document.getElementById('pigDistChart');

            if (!chartCanvas || !window.Chart) {
                return;
            }

            const cs = getComputedStyle(document.documentElement);

            const colors = [
                cs.getPropertyValue('--brand-gradient-start').trim() || '#198754',
                cs.getPropertyValue('--brand-blue').trim() || '#0d6efd',
                cs.getPropertyValue('--warning').trim() || '#ffc107',
                cs.getPropertyValue('--danger').trim() || '#dc3545',
                '#6f42c1',
                cs.getPropertyValue('--brand-gradient-end').trim() || '#20c997'
            ];

            const labels = /*[[${pigDist != null ? pigDist.keySet() : {}}]]*/[];
            const data = /*[[${pigDist != null ? pigDist.values() : {}}]]*/[];
            const farmIds = /*[[${farmIds != null ? farmIds : {}}]]*/ {};

            new Chart(chartCanvas, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: colors
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            position: 'bottom'
                        }
                    },
                    onClick: function (_, elements) {
                        if (!elements.length) {
                            return;
                        }

                        const index = elements[0].index;
                        const farmName = labels[index];
                        const farmId = farmIds[farmName];

                        if (farmId) {
                            window.location.href = '/admin/farms/' + farmId;
                        }
                    }
                }
            });
        });
    </script>

    <script th:src="@{/js/main.js}"></script>

</body>

</html>
