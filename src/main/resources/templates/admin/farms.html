<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <title>Manage Farms | SwineCore</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" th:href="@{/css/main.css}" />

    <style>
        .farm-card {
            border: 0;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, .08);
            overflow: hidden;
        }

        .farm-search {
            height: 42px;
            border-radius: 12px;
            max-width: 280px;
        }

        .farm-header-search {
            width: 280px;
        }

        .farm-header-actions {
            margin-left: auto;
        }

        .farm-table th,
        .farm-table td {
            vertical-align: middle;
            white-space: nowrap;
            padding: .85rem;
        }

        .farm-pagination-footer {
            padding: 1rem;
        }

        .farm-pagination-info {
            text-align: center;
            margin-bottom: .75rem;
        }

        .farm-pagination {
            display: flex;
            gap: .45rem;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 0;
        }

        .farm-pagination .page-item .page-link {
            min-width: 40px;
            height: 40px;
            padding: 0 12px;
            border-radius: 12px;
            border: 1px solid #d7e7dc;
            background: #ffffff;
            color: #198754;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            box-shadow: none;
            cursor: pointer;
        }

        .farm-pagination .page-item.active .page-link {
            background: #198754;
            border-color: #198754;
            color: #ffffff;
        }

        .farm-pagination .page-item.disabled .page-link {
            background: #f8f9fa;
            border-color: #e9ecef;
            color: #9aa4ad;
            pointer-events: none;
        }

        .farm-action-group {
            display: flex;
            gap: .4rem;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        @media (max-width: 768px) {

            .farm-search,
            .farm-header-search {
                max-width: none;
                width: 100%;
            }

            .farm-header-actions {
                width: 100%;
            }

            .farm-header-actions .btn {
                width: 100%;
            }

            .farm-action-group {
                justify-content: flex-start;
            }
        }
    </style>
</head>

<body class="d-flex">

    <th:block th:replace="~{layout/base :: sidebar}"></th:block>

    <div id="main-content" class="flex-grow-1 p-4 overflow-auto">

        <th:block th:replace="~{layout/base :: alerts}"></th:block>

        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
            <div>
                <h2 class="fw-bold mb-1">
                    <i class="bi bi-house-door me-2 text-success"></i>
                    Manage Farms
                </h2>
                <div class="text-muted small">
                    View, search, edit and delete farms.
                </div>
            </div>

            <div class="d-flex align-items-center gap-3 flex-wrap farm-header-actions">
                <input type="text" id="farmSearchInput" class="form-control farm-search farm-header-search"
                    placeholder="Search farms..." />

                <a th:href="@{/admin/farms/new}" class="btn btn-success">
                    <i class="bi bi-plus-circle me-1"></i>
                    New Farm
                </a>
            </div>
        </div>

        <div class="card farm-card">
            <div class="card-header bg-transparent">
                <div>
                    <h6 class="fw-bold mb-0">
                        <i class="bi bi-building me-2 text-success"></i>
                        Farms
                    </h6>
                    <small class="text-muted">
                        Total:
                        <span th:text="${farms != null ? #lists.size(farms) : 0}">0</span>
                    </small>
                </div>
            </div>

            <div th:if="${farms == null || #lists.isEmpty(farms)}" class="text-center text-muted py-5">
                <i class="bi bi-inbox fs-1 d-block mb-2"></i>
                No farms yet.
            </div>

            <div th:if="${farms != null && !#lists.isEmpty(farms)}" class="table-responsive">
                <table class="table table-hover align-middle mb-0 farm-table" id="farmTable" data-no-live-search="true">
                    <thead class="table-light">
                        <tr>
                            <th>No.</th>
                            <th>Farm</th>
                            <th>Code</th>
                            <th>Location</th>
                            <th>Buildings</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr class="farm-row" th:each="farm : ${farms}">
                            <td class="farm-row-number">1.</td>

                            <td class="fw-semibold" th:text="${farm.name}">
                                Farm Name
                            </td>

                            <td>
                                <code th:text="${farm.code}">CODE</code>
                            </td>

                            <td th:text="${farm.location}">
                                Location
                            </td>

                            <td>
                                <span class="badge bg-success"
                                    th:text="${farm.buildings != null ? farm.buildings.size() : 0}">
                                    0
                                </span>
                            </td>

                            <td class="text-end">
                                <div class="farm-action-group">
                                    <a th:href="@{/admin/farms/__${farm.id}__}" class="btn btn-sm btn-outline-primary">
                                        <i class="bi bi-eye me-1"></i>
                                        View
                                    </a>

                                    <a th:href="@{/admin/farms/__${farm.id}__/edit}"
                                        class="btn btn-sm btn-outline-secondary">
                                        <i class="bi bi-pencil-square me-1"></i>
                                        Edit
                                    </a>

                                    <button class="btn btn-sm btn-outline-danger" type="button" data-bs-toggle="modal"
                                        th:data-bs-target="'#delFarm' + ${farm.id}">
                                        <i class="bi bi-trash me-1"></i>
                                        Delete
                                    </button>
                                </div>
                            </td>
                        </tr>

                        <tr id="farmNoResultRow" class="d-none">
                            <td colspan="6" class="text-center text-muted py-4">
                                <i class="bi bi-search me-2"></i>
                                No farms match your search.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div th:if="${farms != null && !#lists.isEmpty(farms)}"
                class="card-footer bg-transparent farm-pagination-footer">
                <div class="text-muted small farm-pagination-info" id="farmPaginationInfo">
                    Showing 0 to 0 of 0 farms
                </div>

                <nav aria-label="Farm pagination">
                    <ul class="pagination farm-pagination" id="farmPagination"></ul>
                </nav>
            </div>
        </div>

        <!-- Delete Modals -->
        <th:block th:each="farm : ${farms}">
            <div class="modal fade" th:id="'delFarm' + ${farm.id}" tabindex="-1">
                <div class="modal-dialog modal-sm">
                    <div class="modal-content">

                        <div class="modal-header border-0">
                            <h5 class="modal-title text-danger">
                                <i class="bi bi-trash me-1"></i>
                                Delete Farm
                            </h5>

                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>

                        <div class="modal-body">
                            <p class="small">Type farm name to confirm deletion:</p>

                            <p class="fw-semibold text-center" th:text="${farm.name}">
                                Farm Name
                            </p>

                            <form th:action="@{/admin/farms/__${farm.id}__/delete}" method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                                <input type="text" name="confirmName" class="form-control mb-3" placeholder="Farm name"
                                    required />

                                <button type="submit" class="btn btn-danger w-100">
                                    Delete Farm
                                </button>
                            </form>
                        </div>

                    </div>
                </div>
            </div>
        </th:block>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            setupFarmTable({
                rowSelector: '.farm-row',
                searchInputId: 'farmSearchInput',
                noResultRowId: 'farmNoResultRow',
                paginationId: 'farmPagination',
                paginationInfoId: 'farmPaginationInfo',
                numberCellSelector: '.farm-row-number',
                itemName: 'farms'
            });

            function setupFarmTable(config) {
                const rows = Array.from(document.querySelectorAll(config.rowSelector));
                const searchInput = document.getElementById(config.searchInputId);
                const noResultRow = document.getElementById(config.noResultRowId);
                const pagination = document.getElementById(config.paginationId);
                const paginationInfo = document.getElementById(config.paginationInfoId);

                const pageSize = 10;
                let currentPage = 1;
                let filteredRows = [];

                function rowMatchesSearch(row) {
                    const query = searchInput ? searchInput.value.trim().toLowerCase() : '';
                    return !query || row.innerText.toLowerCase().includes(query);
                }

                function calculateFilteredRows() {
                    filteredRows = rows.filter(rowMatchesSearch);
                }

                function renderRows() {
                    rows.forEach(function (row) {
                        row.style.display = 'none';
                    });

                    const total = filteredRows.length;
                    const totalPages = Math.max(1, Math.ceil(total / pageSize));

                    if (currentPage > totalPages) {
                        currentPage = totalPages;
                    }

                    const startIndex = (currentPage - 1) * pageSize;
                    const endIndex = Math.min(startIndex + pageSize, total);

                    filteredRows.slice(startIndex, endIndex).forEach(function (row, index) {
                        row.style.display = '';

                        const numberCell = row.querySelector(config.numberCellSelector);
                        if (numberCell) {
                            numberCell.textContent = (startIndex + index + 1) + '.';
                        }
                    });

                    if (noResultRow) {
                        noResultRow.classList.toggle('d-none', total > 0);
                    }

                    if (paginationInfo) {
                        paginationInfo.textContent = total === 0
                            ? 'Showing 0 to 0 of 0 ' + config.itemName
                            : 'Showing ' + (startIndex + 1) + ' to ' + endIndex + ' of ' + total + ' ' + config.itemName;
                    }

                    renderPagination(totalPages);
                }

                function createPageItem(label, disabled, active, clickHandler) {
                    const li = document.createElement('li');

                    li.className = 'page-item'
                        + (disabled ? ' disabled' : '')
                        + (active ? ' active' : '');

                    const btn = document.createElement('button');
                    btn.className = 'page-link';
                    btn.type = 'button';
                    btn.innerHTML = label;

                    if (!disabled && typeof clickHandler === 'function') {
                        btn.addEventListener('click', clickHandler);
                    }

                    li.appendChild(btn);
                    return li;
                }

                function renderPagination(totalPages) {
                    if (!pagination) {
                        return;
                    }

                    pagination.innerHTML = '';

                    if (filteredRows.length <= pageSize) {
                        return;
                    }

                    pagination.appendChild(createPageItem(
                        '<i class="bi bi-chevron-left"></i>',
                        currentPage === 1,
                        false,
                        function () {
                            currentPage--;
                            renderRows();
                        }
                    ));

                    for (let i = 1; i <= totalPages; i++) {
                        if (i === 1 || i === totalPages || Math.abs(i - currentPage) <= 2) {
                            pagination.appendChild(createPageItem(
                                String(i),
                                false,
                                i === currentPage,
                                function () {
                                    currentPage = i;
                                    renderRows();
                                }
                            ));
                        } else if (i === currentPage - 3 || i === currentPage + 3) {
                            pagination.appendChild(createPageItem('...', true, false, null));
                        }
                    }

                    pagination.appendChild(createPageItem(
                        '<i class="bi bi-chevron-right"></i>',
                        currentPage === totalPages,
                        false,
                        function () {
                            currentPage++;
                            renderRows();
                        }
                    ));
                }

                function applySearch(resetPage) {
                    if (resetPage) {
                        currentPage = 1;
                    }

                    calculateFilteredRows();
                    renderRows();
                }

                if (searchInput) {
                    searchInput.addEventListener('input', function () {
                        applySearch(true);
                    });
                }

                applySearch(true);
            }
        });
    </script>

</body>

</html>
