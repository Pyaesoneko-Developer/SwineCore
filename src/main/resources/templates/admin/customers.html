<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Customers | SwineCore</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/><link rel="stylesheet" th:href="@{/css/main.css}"/></head><body class="d-flex"><th:block th:replace="~{layout/base :: sidebar}"></th:block><main id="main-content" class="flex-grow-1 p-4 overflow-auto"><th:block th:replace="~{layout/base :: alerts}"></th:block><div class="mb-4"><h2 class="fw-bold"><i class="bi bi-person-heart me-2 text-success"></i>Customer Accounts</h2><p class="text-muted mb-0">Customers register themselves. Administrators can review and restrict accounts but cannot create customers.</p></div><div class="alert alert-info"><i class="bi bi-info-circle me-2"></i>No Create Customer action is available on this page.</div><div class="card border-0 shadow-sm"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead class="table-light"><tr><th>Customer</th><th>Contact</th><th>Joined</th><th>Status</th><th style="min-width:330px">Admin Action</th></tr></thead><tbody><tr th:each="c:${customers}"><td><strong th:text="${c.name}"></strong><br/><small class="text-muted" th:text="'ID #' + ${c.id}"></small></td><td><span th:text="${c.email}"></span><br/><small th:text="${c.phone ?: 'No phone'}"></small></td><td th:text="${#temporals.format(c.createdAt,'dd MMM yyyy')}"></td><td><span class="badge" th:classappend="${c.enabled ? 'bg-success' : (customerService.statusOf(c)=='BANNED' ? 'bg-danger' : 'bg-warning text-dark')}" th:text="${customerService.statusOf(c)}"></span><div th:unless="${c.enabled}" class="small text-muted mt-1" th:text="${customerService.restrictionReason(c)}"></div></td><td><div th:if="${c.enabled}" class="d-flex gap-2"><form th:action="@{/admin/customers/__${c.id}__/restrict}" method="post" class="d-flex gap-1"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/><input type="hidden" name="status" value="SUSPENDED"/><input name="reason" class="form-control form-control-sm" placeholder="Suspend reason" required/><button class="btn btn-warning btn-sm">Suspend</button></form><form th:action="@{/admin/customers/__${c.id}__/restrict}" method="post" class="d-flex gap-1"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/><input type="hidden" name="status" value="BANNED"/><input name="reason" class="form-control form-control-sm" placeholder="Ban reason" required/><button class="btn btn-danger btn-sm">Ban</button></form></div><form th:unless="${c.enabled}" th:action="@{/admin/customers/__${c.id}__/activate}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/><button class="btn btn-success btn-sm">Restore Account</button></form></td></tr><tr th:if="${#lists.isEmpty(customers)}"><td colspan="5" class="text-center text-muted py-5">No registered customers.</td></tr></tbody></table></div></div></main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script th:src="@{/js/main.js}"></script></body></html>
