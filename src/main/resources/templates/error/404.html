<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/>
<title>Not Found | SwineCore</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
<link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body class="d-flex align-items-center justify-content-center vh-100" style="background:var(--bg-body);color:var(--text-primary);">
<div class="text-center">
    <div class="display-1 fw-bold text-secondary mb-3">404</div>
    <h4 class="mb-2">Page Not Found</h4>
    <p class="text-muted" th:text="${message}">The page you are looking for does not exist.</p>
    <a href="/dashboard" class="btn btn-success">Go to Dashboard</a>
</div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
