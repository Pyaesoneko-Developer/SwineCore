<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pigs for Sale | SwineCore</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" th:href="@{/css/main.css}" />
</head>

<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark px-4"><a class="navbar-brand fw-bold" th:href="@{/marketplace}"><img
                th:src="@{/images/logo.png}" style="height:28px" class="me-2" alt="SwineCore" />SwineCore</a>
        <div class="ms-auto d-flex gap-2"><a th:href="@{/customer/dashboard}" class="btn btn-outline-light btn-sm">My
                Account</a><a th:href="@{/customer/semen}" class="btn btn-outline-success btn-sm">Semen Market</a></div>
    </nav>
    <main class="container py-4">
        <th:block th:replace="~{layout/base :: alerts}"></th:block>
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
            <div>
                <div class="text-success small fw-semibold text-uppercase">Livestock marketplace</div>
                <h2 class="fw-bold mb-0"><i class="bi bi-piggy-bank me-2"></i>Pigs for Sale</h2>
                <div class="text-muted"><span th:text="${totalItems}">0</span> pigs found · 15 per page</div>
            </div>
            <button id="checkoutButton" class="btn btn-success btn-lg px-4" type="submit" form="cartForm" disabled><i
                    class="bi bi-cart-check me-2"></i>Proceed to Checkout <span class="badge text-bg-light ms-1"
                    id="selectedCount">0</span></button>
        </div>
        <form method="get" th:action="@{/customer/pigs}" data-live-filter class="card border-0 shadow-sm mb-4">
            <div class="card-body row g-3 align-items-end">
                <div class="col-md-3"><label class="form-label fw-semibold">Farm</label><select class="form-select"
                        name="farmId">
                        <option value="">All farms</option>
                        <option th:each="farm : ${farms}" th:value="${farm.id}" th:text="${farm.name}"
                            th:selected="${farmId != null and farm.id == farmId}"></option>
                    </select></div>
                <div class="col-md-2"><label class="form-label fw-semibold">Category</label><select class="form-select"
                        name="category">
                        <option value="">All categories</option>
                        <option th:each="item : ${categories}" th:value="${item}"
                            th:text="${#strings.capitalize(#strings.toLowerCase(item))}"
                            th:selected="${item == category}"></option>
                    </select></div>
                <div class="col-md-2"><small class="text-muted">Filters update instantly</small></div>
            </div>
        </form>
        <form th:action="@{/customer/cart/checkout}" method="post" id="cartForm"><input type="hidden"
                th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <div id="cartFields"></div>
            <div class="row g-4">
                <div class="col-xl-4 col-md-6" th:each="pig : ${pigs}">
                    <article class="card border-0 shadow-sm h-100 overflow-hidden pig-sale-card">
                        <div class="position-relative"><img
                                th:src="${pig.photoPath != null and !#strings.isEmpty(pig.photoPath) ? pig.photoPath : '/images/pigs/demo-piglets.jpg'}"
                                class="w-100" style="height:190px;object-fit:cover" alt="Pig for sale" /><span
                                class="badge bg-dark position-absolute top-0 start-0 m-3"
                                th:text="${pig.status}"></span></div>
                        <div class="card-body">
                            <div class="d-flex justify-content-between gap-2">
                                <div>
                                    <div class="text-muted small">Pig code</div>
                                    <h5 class="fw-bold mb-1" th:text="${pig.code}"></h5>
                                </div>
                                <div class="text-end">
                                    <div class="text-muted small">Price</div>
                                    <div class="text-success fw-bold fs-5"
                                        th:text="${#numbers.formatDecimal(pig.salePrice,0,'COMMA',0,'POINT')} + ' MMK'">
                                    </div>
                                </div>
                            </div>
                            <hr />
                            <div class="row g-2 small">
                                <div class="col-6"><span class="text-muted d-block">Farm</span><strong
                                        th:text="${pig.building.farm.name}"></strong></div>
                                <div class="col-6"><span class="text-muted d-block">Category / Breed</span><strong
                                        th:text="${pig.genetics.name}"></strong></div>
                                <div class="col-6"><span class="text-muted d-block">Gender</span><strong
                                        th:text="${pig.gender}"></strong></div>
                                <div class="col-6"><span class="text-muted d-block">Age</span><strong
                                        th:text="${pig.ageInDays} + ' days'"></strong></div>
                            </div>
                        </div><label class="card-footer bg-white border-0 p-3"><input type="checkbox"
                                class="btn-check cart-check" th:id="'pig-'+${pig.id}" th:attr="data-pig-id=${pig.id}"
                                autocomplete="off" /><span class="btn btn-outline-success w-100"><i
                                    class="bi bi-cart-plus me-1"></i><span class="cart-label">Add to
                                    cart</span></span></label>
                    </article>
                </div>
            </div>
            <div th:if="${#lists.isEmpty(pigs)}" class="card border-0 shadow-sm text-center text-muted py-5"><i
                    class="bi bi-search fs-1 mb-2"></i>
                <p class="mb-0">No pigs match the selected filters.</p>
            </div>
        </form>
        <nav th:if="${totalPages > 1}" class="mt-4" aria-label="Pig pages">
            <ul class="pagination justify-content-center align-items-center">
                <!-- Previous -->
                <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                    <a class="page-link"
                        th:href="@{/customer/pigs(page=${currentPage-1},farmId=${farmId},category=${category})}">
                        <i class="bi bi-chevron-left"></i>
                    </a>
                </li>

                <!-- 5 page range -->
                <li class="page-item" th:each="i : ${#numbers.sequence((currentPage / 5) * 5, T(java.lang.Math).min(((currentPage / 5) * 5)+4,totalPages-1))}" th:classappend="${i == currentPage} ? 'active'">
                    <a class="page-link" th:href="@{/customer/pigs(page=${i},farmId=${farmId},category=${category})}"
                        th:text="${i+1}">
                    </a>
                </li>

                <!-- Next -->
                <li class="page-item" th:classappend="${currentPage+1 >= totalPages} ? 'disabled'">

                    <a class="page-link"
                        th:href="@{/customer/pigs(page=${currentPage+1},farmId=${farmId},category=${category})}">
                        <i class="bi bi-chevron-right"></i>
                    </a>

                </li>


            </ul>

        </nav>
    </main>
    <script>
        (() => { const key = 'swinecorePigCart'; let selected = []; try { selected = JSON.parse(localStorage.getItem(key) || '[]').map(String) } catch (e) { selected = [] } const boxes = [...document.querySelectorAll('.cart-check')], count = document.getElementById('selectedCount'), button = document.getElementById('checkoutButton'), fields = document.getElementById('cartFields'); const paint = () => { boxes.forEach(b => { b.checked = selected.includes(b.dataset.pigId); const l = b.parentElement.querySelector('.cart-label'); if (l) l.textContent = b.checked ? 'Added to cart' : 'Add to cart' }); count.textContent = selected.length; button.disabled = !selected.length; localStorage.setItem(key, JSON.stringify(selected)) }; boxes.forEach(b => b.addEventListener('change', () => { selected = b.checked ? [...new Set([...selected, b.dataset.pigId])] : selected.filter(id => id !== b.dataset.pigId); paint() })); document.getElementById('cartForm').addEventListener('submit', e => { if (!selected.length) { e.preventDefault(); return } fields.replaceChildren(...selected.map(id => { const input = document.createElement('input'); input.type = 'hidden'; input.name = 'pigIds'; input.value = id; return input })) }); paint() })();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>

</html>
