<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Register | SwineCore Marketplace</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body class="auth-page auth-page-scroll">

<div class="auth-card" style="max-width:480px;">
    <!-- Logo & Title -->
    <div class="text-center mb-4">
        <img th:src="@{/images/logo.png}" alt="SwineCore" class="auth-logo"/>
        <h2 class="auth-title">Create Account</h2>
        <p class="auth-subtitle">Join SwineCore Marketplace</p>
    </div>

    <!-- Error Message -->
    <div th:if="${error}" class="sw-alert-overlay" role="alert">
        <div class="sw-alert sw-alert-danger"><i class="bi bi-x-circle-fill"></i><span class="visually-hidden" th:text="${error}"></span></div>
    </div>

    <!-- Registration Form -->
    <form th:action="@{/customer/register}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="mb-3">
            <label class="form-label">Full Name</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person"></i></span>
                <input type="text" name="name" class="form-control" placeholder="e.g. Kyaw Zin" required/>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Email Address</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                <input type="email" name="email" class="form-control" placeholder="you@example.com" required/>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Password</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" name="password" class="form-control" placeholder="Min 8 chars, 1 upper, 1 lower, 1 number, 1 special" required minlength="8" pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&#])[A-Za-z\d@$!%*?&#]{8,}$" title="Must contain at least 8 characters: 1 uppercase, 1 lowercase, 1 number, 1 special character (@$!%*?&#)"/>
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label">Phone <span style="opacity:0.5;">(optional)</span></label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                <input type="text" name="phone" class="form-control" placeholder="+95 9 123 456 789"/>
            </div>
        </div>

        <button type="submit" class="btn btn-auth w-100">
            <i class="bi bi-person-check me-2"></i>Create Account
        </button>
    </form>

    <!-- Divider -->
    <div class="auth-divider"><span>or</span></div>

    <!-- Footer Links -->
    <div class="auth-footer-links">
        <a th:href="@{/auth/login}" class="auth-link">
            <i class="bi bi-box-arrow-in-right me-1"></i>Already have an account? Sign in
        </a>
    </div>
    <div class="text-center mt-2">
        <a th:href="@{/marketplace}" class="auth-link" style="font-size:0.8rem;">
            <i class="bi bi-shop me-1"></i>Browse without account
        </a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
