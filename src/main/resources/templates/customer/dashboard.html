<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>My Account | SwineCore</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
    <style>
        .avatar-sm {
            width:36px; height:36px; border-radius:50%; object-fit:cover;
            border:2px solid var(--avatar-border);
        }
        .avatar-sm-placeholder {
            width:36px; height:36px; border-radius:50%;
            background:linear-gradient(135deg,var(--brand-gradient-start),var(--brand-gradient-end));
            display:inline-flex; align-items:center; justify-content:center;
            font-size:.8rem; font-weight:700; color:var(--text-on-brand);
            border:2px solid var(--avatar-border);
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4">
    <a class="navbar-brand fw-bold" href="/marketplace">
        <img th:src="@{/images/logo.png}" style="height:24px;" class="me-2" alt="SwineCore"/>SwineCore
    </a>
    <div class="ms-auto d-flex align-items-center gap-2">
        <a th:href="@{/customer/pigs}" class="btn btn-success btn-sm">
            <i class="bi bi-cart me-1"></i>Buy Pigs
        </a>
        <a th:href="@{/customer/semen}" class="btn btn-outline-success btn-sm">Semen</a>

        <!-- Profile dropdown -->
        <div class="dropdown">
            <a href="#" class="d-flex align-items-center text-white text-decoration-none dropdown-toggle gap-2"
               data-bs-toggle="dropdown" aria-expanded="false">
                <img th:if="${customer.profileImagePath != null}"
                     th:src="${customer.profileImagePath}"
                     class="avatar-sm" alt="Profile"/>
                <span th:unless="${customer.profileImagePath != null}"
                      class="avatar-sm-placeholder"
                      th:text="${customer.initials}">
                    AB
                </span>
                <span class="d-none d-md-inline small" th:text="${customer.name}">Name</span>
            </a>
            <ul class="dropdown-menu dropdown-menu-dark dropdown-menu-end shadow">
                <li>
                    <a class="dropdown-item" th:href="@{/customer/profile}">
                        <i class="bi bi-person me-2"></i>My Profile
                    </a>
                </li>
                <li><hr class="dropdown-divider"/></li>
                <li>
                    <form th:action="@{/auth/logout}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="dropdown-item text-danger">
                            <i class="bi bi-box-arrow-right me-2"></i>Logout
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container py-4">
    <!-- Alerts -->
    <th:block th:replace="~{layout/base :: alerts}"></th:block>

    <!-- Welcome header with profile photo -->
    <div class="d-flex align-items-center gap-3 mb-4">
        <img th:if="${customer.profileImagePath != null}"
             th:src="${customer.profileImagePath}"
             class="rounded-circle" width="54" height="54"
             style="object-fit:cover; border:3px solid var(--primary);"
             alt="Profile"/>
        <div th:unless="${customer.profileImagePath != null}"
             class="rounded-circle d-flex align-items-center justify-content-center fw-bold"
             style="width:54px;height:54px;background:linear-gradient(135deg,var(--brand-gradient-start),var(--brand-gradient-end));
                    color:var(--text-on-brand);font-size:1.3rem;border:3px solid var(--primary);"
             th:text="${customer.initials}">
            AB
        </div>
        <div>
            <h4 class="fw-bold mb-0">Welcome, <span th:text="${customer.name}"></span>!</h4>
            <div class="text-muted small" th:text="${customer.email}"></div>
        </div>
        <a th:href="@{/customer/profile}" class="btn btn-sm btn-outline-success ms-auto">
            <i class="bi bi-pencil me-1"></i>Edit Profile
        </a>
    </div>

    <div class="row g-3" id="orders">
        <!-- Pig Orders -->
        <div class="col-md-6">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-transparent fw-semibold">
                    <i class="bi bi-receipt me-2 text-success"></i>Pig Orders
                </div>
                <div class="table-responsive">
                    <table class="table table-hover mb-0 small">
                        <thead class="table-light">
                            <tr><th>Reference</th><th>Amount</th><th>Status</th><th></th></tr>
                        </thead>
                        <tbody>
                        <tr th:each="o : ${pigOrders}">
                            <td><code th:text="${o.orderReference}"></code></td>
                            <td th:text="${#numbers.formatDecimal(o.totalAmount,0,'COMMA',0,'POINT')} + ' MMK'"></td>
                            <td><span class="badge bg-secondary" th:text="${o.status}"></span></td>
                            <td>
                                <a th:href="@{/customer/orders/pig/__${o.id}__}"
                                   class="btn btn-sm btn-success">View Voucher</a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(pigOrders)}">
                            <td colspan="4" class="text-muted text-center py-3">No pig orders yet.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Semen Orders -->
        <div class="col-md-6">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-transparent fw-semibold">
                    <i class="bi bi-capsule me-2 text-success"></i>Semen Orders
                </div>
                <div class="table-responsive">
                    <table class="table table-hover mb-0 small">
                        <thead class="table-light">
                            <tr><th>Reference</th><th>Boar</th><th>Amount</th><th>Status</th><th></th></tr>
                        </thead>
                        <tbody>
                        <tr th:each="o : ${semenOrders}">
                            <td><code th:text="${o.orderReference}"></code></td>
                            <td><code th:text="${o.boar.code}"></code></td>
                            <td th:text="${#numbers.formatDecimal(o.totalAmount,0,'COMMA',0,'POINT')} + ' MMK'"></td>
                            <td><span class="badge bg-secondary" th:text="${o.status}"></span></td>
                            <td>
                                <a th:href="@{/customer/orders/semen/__${o.id}__}"
                                   class="btn btn-sm btn-success">View Voucher</a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(semenOrders)}">
                            <td colspan="5" class="text-muted text-center py-3">No semen orders yet.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
