<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Payment Voucher | SwineCore</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 22px; background: #eef3f0; color: #18312b;
               font-family: Arial, Helvetica, sans-serif; }
        .voucher { width: 100%; max-width: 470px; margin: 20px auto; background: #fff;
                   border-radius: 18px; box-shadow: 0 12px 35px rgba(18,62,51,.14); overflow: hidden; }
        .head { padding: 26px 24px; color: #fff; text-align: center; background: #1f6a52; }
        .head h1 { margin: 0 0 6px; font-size: 26px; }
        .head p { margin: 0; opacity: .85; }
        .body { padding: 22px 24px 26px; }
        .row { display: flex; justify-content: space-between; gap: 20px; padding: 12px 0;
               border-bottom: 1px dashed #d6dfda; }
        .label { color: #6b7772; }
        .value { text-align: right; font-weight: 700; overflow-wrap: anywhere; }
        .details { display: block; }
        .details .value { margin-top: 8px; text-align: left; line-height: 1.45; }
        .total { padding: 20px 0 10px; border: 0; align-items: center; }
        .total .value { color: #1f6a52; font-size: 29px; }
        .status { display: inline-block; padding: 7px 13px; border-radius: 999px;
                  background: #fff2cc; color: #765900; font-size: 13px; }
        .paid { background: #dcece4; color: #15533f; }
        .message { width:68px;height:68px;margin:0 auto 16px;padding:10px;border-radius:14px;text-align:center;font-size:40px;font-weight:700;line-height:48px; }
        .success { background: #dcece4; color: #15533f; }
        .error { background: #fde2dc; color: #8b2d1c; }
        button { width: 100%; margin-top: 16px; padding: 15px; border: 0; border-radius: 11px;
                 background: #1f6a52; color: #fff; font-size: 18px; font-weight: 700; cursor: pointer; }
        button:active { transform: translateY(1px); }
        .paid-note { margin-top: 18px; text-align: center; color: #1f6a52; font-weight: 700; }
        .foot { padding-top: 18px; color: #8b9691; text-align: center; font-size: 12px; }
    </style>
</head>
<body>
<main class="voucher">
    <header class="head">
        <h1>SwineCore Voucher</h1>
        <p>Secure QR Payment</p>
    </header>
    <section class="body">
        <div th:if="${success}" class="message success" role="status" aria-label="Success">✓</div>
        <div th:if="${error}" class="message error" role="alert" aria-label="Error">✕</div>

        <div th:if="${voucher != null}">
            <div class="row"><span class="label">Voucher No.</span><span class="value" th:text="${voucher.reference}"></span></div>
            <div class="row"><span class="label">Customer</span><span class="value" th:text="${voucher.customerName}"></span></div>
            <div class="row" th:if="${voucher.phone != null and !voucher.phone.isBlank()}">
                <span class="label">Phone</span><span class="value" th:text="${voucher.phone}"></span>
            </div>
            <div class="row"><span class="label">Order Type</span><span class="value" th:text="${voucher.type}"></span></div>
            <div class="row"><span class="label">Farm</span><span class="value" th:text="${voucher.farm}"></span></div>
            <div class="row details"><span class="label">Details</span><span class="value" th:text="${voucher.details}"></span></div>
            <div class="row"><span class="label">Status</span>
                <span class="value status" th:classappend="${voucher.status.name() == 'PAID' or voucher.status.name() == 'DISPATCHED'} ? ' paid' : ''"
                      th:text="${voucher.status}"></span>
            </div>
            <div class="row total"><span class="label">Total Amount</span>
                <span class="value" th:text="${#numbers.formatDecimal(voucher.total,1,2)} + ' MMK'"></span>
            </div>

            <form th:if="${voucher.status.name() != 'PAID' and voucher.status.name() != 'DISPATCHED'}"
                  th:action="@{/checkout/pay/{ref}(ref=${ref})}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="hidden" name="type" th:value="${type}"/>
                <input type="hidden" name="amount" th:value="${amount}"/>
                <input type="hidden" name="farm" th:value="${farm}"/>
                <input type="hidden" name="details" th:value="${details}"/>
                <input type="hidden" name="sig" th:value="${sig}"/>
                <button type="submit">Confirm Payment</button>
            </form>

        </div>
        <div class="foot">This voucher is protected by a signed QR code.</div>
    </section>
</main>
</body>
</html>
