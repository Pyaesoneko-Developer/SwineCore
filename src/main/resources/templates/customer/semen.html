<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Semen Market | SwineCore</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" th:href="@{/css/main.css}" />
</head>

<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark px-4"><a class="navbar-brand fw-bold" th:href="@{/marketplace}"><img
                th:src="@{/images/logo.png}" style="height:28px" class="me-2" alt="SwineCore" />SwineCore</a>
        <div class="ms-auto d-flex gap-2"><a th:href="@{/customer/dashboard}" class="btn btn-outline-light btn-sm">My
                Account</a><a th:href="@{/customer/pigs}" class="btn btn-success btn-sm">Buy Pigs</a></div>
    </nav>
    <main class="container py-4">
        <th:block th:replace="~{layout/base :: alerts}"></th:block>
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
            <div>
                <div class="text-primary small fw-semibold text-uppercase">Breeding marketplace</div>
                <h2 class="fw-bold mb-0"><i class="bi bi-droplet-half me-2 text-primary"></i>Semen Market</h2>
                <div class="text-muted"><span th:text="${totalItems}">0</span> breeding boars found · 15 per page</div>
            </div><button id="semenCheckout" type="submit" form="semenCartForm" class="btn btn-primary btn-lg px-4"
                disabled><i class="bi bi-cart-check me-2"></i>Proceed to Checkout</button>
        </div>
        <form method="get" th:action="@{/customer/semen}" class="card border-0 shadow-sm mb-4">
            <div class="card-body row g-3 align-items-end">
                <div class="col-md-4"><label class="form-label fw-semibold">Farm</label><select class="form-select"
                        name="farmId">
                        <option value="">All farms</option>
                        <option th:each="farm:${farms}" th:value="${farm.id}" th:text="${farm.name}"
                            th:selected="${farmId != null and farm.id == farmId}"></option>
                    </select></div>
                <div class="col-md-4"><label class="form-label fw-semibold">Category</label><select class="form-select"
                        name="category">
                        <option value="">All genetics</option>
                        <option th:each="item:${categories}" th:value="${item.code}" th:text="${item.name}"
                            th:selected="${item.code == category}"></option>
                    </select></div>
                <div class="col-md-4 d-grid"><button class="btn btn-dark"><i class="bi bi-funnel me-1"></i>Apply
                        filters</button></div>
            </div>
        </form>
        <form id="semenCartForm" th:action="@{/customer/semen/order}" method="post"><input type="hidden"
                th:name="${_csrf.parameterName}" th:value="${_csrf.token}" /><input type="hidden" name="boarId"
                id="selectedBoar" /><input type="hidden" name="quantity" id="selectedQuantity" value="1" />
            <div class="row g-4">
                <div class="col-xl-4 col-md-6" th:each="boar:${boars}">
                    <article class="card border-0 shadow-sm h-100 overflow-hidden">
                        <div class="position-relative"><img
                                th:if="${boar.photoPath != null and !#strings.isEmpty(boar.photoPath)}"
                                th:src="${boar.photoPath}" class="w-100" style="height:190px;object-fit:cover"
                                alt="Breeding boar" />
                            <div th:unless="${boar.photoPath != null and !#strings.isEmpty(boar.photoPath)}"
                                class="d-flex align-items-center justify-content-center bg-body-tertiary"
                                style="height:190px"><i class="bi bi-piggy-bank text-secondary display-4"></i></div>
                            <span class="badge bg-primary position-absolute top-0 start-0 m-3"
                                th:text="${boar.genetics.name}"></span>
                        </div>
                        <div class="card-body">
                            <div class="d-flex justify-content-between">
                                <div>
                                    <div class="text-muted small">Boar code</div>
                                    <h5 class="fw-bold" th:text="${boar.code}"></h5>
                                </div>
                                <div class="text-end">
                                    <div class="text-muted small">Farm price / dose</div>
                                    <div class="text-primary fw-bold"
                                        th:text="${#numbers.formatDecimal(semenPrices[boar.id],0,'COMMA',0,'POINT')} + ' MMK'">
                                    </div>
                                </div>
                            </div>
                            <div class="row g-2 small my-2">
                                <div class="col-7"><span class="text-muted d-block">Farm</span><strong
                                        th:text="${boar.building.farm.name}"></strong></div>
                                <div class="col-5"><span class="text-muted d-block">Age</span><strong
                                        th:text="${boar.ageInDays}+' days'"></strong></div>
                            </div><label class="form-label fw-semibold small mt-2">Quantity (doses)</label><input
                                type="number" class="form-control semen-qty" min="1" max="100" value="1"
                                th:attr="data-boar-id=${boar.id}" aria-label="Semen quantity" />
                        </div><label class="card-footer bg-white border-0 p-3"><input type="radio"
                                class="btn-check semen-choice" name="semenChoice" th:id="'boar-'+${boar.id}"
                                th:value="${boar.id}" autocomplete="off" /><span
                                class="btn btn-outline-primary w-100"><i class="bi bi-cart-plus me-1"></i><span
                                    class="choice-label">Add to cart</span></span></label>
                    </article>
                </div>
            </div>
            <div th:if="${#lists.isEmpty(boars)}" class="card border-0 shadow-sm text-center text-muted py-5"><i
                    class="bi bi-search fs-1 mb-2"></i>
                <p class="mb-0">No semen matches the selected filters.</p>
            </div>
        </form>
        <nav th:if="${totalPages > 1}" class="mt-4">
            <ul class="pagination justify-content-center">
                <li class="page-item" th:classappend="${currentPage==0}?'disabled'">
                    <a class="page-link"
                        th:href="@{/customer/semen(page=${currentPage-1},farmId=${farmId},category=${category})}">
                        <i class="bi bi-chevron-left"></i>
                    </a>
                </li>
                <li class="page-item" th:each="i:${#numbers.sequence(0,totalPages-1)}"
                    th:classappend="${i==currentPage}?'active'">
                    <a class="page-link" th:href="@{/customer/semen(page=${i},farmId=${farmId},category=${category})}"
                        th:text="${i+1}">
                    </a>
                </li>
                <li class="page-item" th:classappend="${currentPage+1>=totalPages}?'disabled'">
                    <a class="page-link"
                        th:href="@{/customer/semen(page=${currentPage+1},farmId=${farmId},category=${category})}">
                        <i class="bi bi-chevron-right"></i>
                    </a>
                </li>
            </ul>
        </nav>
    </main>
    <script>(() => { const key = 'swinecoreSemenCart', choices = [...document.querySelectorAll('.semen-choice')], qtys = [...document.querySelectorAll('.semen-qty')], button = document.getElementById('semenCheckout'), boar = document.getElementById('selectedBoar'), quantity = document.getElementById('selectedQuantity'); let cart = {}; try { cart = JSON.parse(localStorage.getItem(key) || '{}') } catch (e) { cart = {} } const paint = () => { choices.forEach(c => { c.checked = String(cart.boarId || '') === c.value; c.parentElement.querySelector('.choice-label').textContent = c.checked ? 'Added to cart' : 'Add to cart' }); qtys.forEach(q => { if (String(cart.boarId || '') === q.dataset.boarId) q.value = cart.quantity || 1 }); boar.value = cart.boarId || ''; quantity.value = cart.quantity || 1; button.disabled = !cart.boarId; localStorage.setItem(key, JSON.stringify(cart)) }; choices.forEach(c => c.addEventListener('change', () => { const q = qtys.find(x => x.dataset.boarId === c.value); cart = { boarId: c.value, quantity: Number(q?.value || 1) }; paint() })); qtys.forEach(q => q.addEventListener('change', () => { q.value = Math.max(1, Math.min(100, Number(q.value) || 1)); if (String(cart.boarId || '') === q.dataset.boarId) { cart.quantity = Number(q.value); paint() } })); document.getElementById('semenCartForm').addEventListener('submit', e => { if (!cart.boarId) e.preventDefault() }); paint() })();</script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>

</html>
