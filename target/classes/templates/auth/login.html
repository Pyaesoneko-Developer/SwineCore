<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Login | SwineCore</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body class="auth-page">

<div class="auth-card">
    <!-- Logo & Title -->
    <div class="text-center mb-4">
        <img th:src="@{/images/logo.png}" alt="SwineCore" class="auth-logo"/>
        <h2 class="auth-title">SwineCore</h2>
        <p class="auth-subtitle">Multi-Farm Pig Management System</p>
    </div>

    <!-- Error / Success Messages -->
    <div th:if="${errorMsg}" class="sw-alert-overlay" role="alert">
        <div class="sw-alert sw-alert-danger"><i class="bi bi-x-circle-fill"></i><span class="visually-hidden" th:text="${errorMsg}"></span></div>
    </div>
    <div th:if="${successMsg}" class="sw-alert-overlay" role="alert">
        <div class="sw-alert sw-alert-success"><i class="bi bi-check-circle-fill"></i><span class="visually-hidden" th:text="${successMsg}"></span></div>
    </div>

    <!-- Login Form -->
    <form th:action="@{/auth/login}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="mb-3">
            <label class="form-label">Email Address</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                <input type="email" name="username" class="form-control" placeholder="you@example.com" required autofocus/>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Password</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" name="password" class="form-control" placeholder="Enter your password" required/>
            </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <a th:href="@{/auth/forgot-password}" class="auth-link">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-auth w-100">
            <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
        </button>
    </form>

    <!-- Divider -->
    <div class="auth-divider"><span>or</span></div>

    <!-- Footer Links -->
    <div class="auth-footer-links">
        <a th:href="@{/marketplace}" class="btn btn-sm" style="background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:inherit;border-radius:10px;">
            <i class="bi bi-shop me-1"></i>Browse Marketplace
        </a>
        <a th:href="@{/customer/register}" class="btn btn-sm" style="background:rgba(22,163,74,0.2);border:1px solid rgba(22,163,74,0.3);color:#4ade80;border-radius:10px;">
            <i class="bi bi-person-plus me-1"></i>Register
        </a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
