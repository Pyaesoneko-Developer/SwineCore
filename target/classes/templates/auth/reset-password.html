<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Reset Password | SwineCore</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body class="auth-page">
<div class="auth-card">
    <div class="text-center mb-4">
        <img th:src="@{/images/logo.png}" alt="SwineCore" class="auth-logo"/>
        <h2 class="auth-title">Reset Password</h2>
        <p class="auth-subtitle">Set your new password below.</p>
    </div>
    <div th:if="${error}" class="sw-alert-overlay" role="alert">
        <div class="sw-alert sw-alert-danger"><i class="bi bi-x-circle-fill"></i><span class="visually-hidden" th:text="${error}"></span></div>
    </div>
    <form th:action="@{/auth/reset-password}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <input type="hidden" name="token" th:value="${token}"/>
        <div class="mb-3">
            <label class="form-label">New Password</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-shield-lock"></i></span>
                <input type="password" name="newPassword" class="form-control" placeholder="Enter new password" required/>
            </div>
        </div>
        <div class="mb-4">
            <label class="form-label">Confirm Password</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-shield-check"></i></span>
                <input type="password" name="confirmPassword" class="form-control" placeholder="Confirm new password" required/>
            </div>
        </div>
        <button type="submit" class="btn btn-auth w-100">
            <i class="bi bi-key me-2"></i>Reset Password
        </button>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
