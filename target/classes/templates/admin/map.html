<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Myanmar Map | SwineCore</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
    <style>
        #farmDrawer {
            position: fixed;
            top: 0; right: 0;
            width: 260px; height: 100vh;
            transform: translateX(100%);
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 1060;
            overflow-y: auto;
            border-left: 1px solid var(--border-color);
            background: var(--bg-card);
        }
        #farmDrawer.open { transform: translateX(0); }
        #drawerOverlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.4);
            z-index: 1055; display: none;
        }
        #drawerOverlay.open { display: block; }
        .map-stat-card {
            background: rgba(255,255,255,0.55);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 12px;
            padding: 1rem 1.25rem;
        }
        #mapFrame {
            width: 100%;
            height: 520px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }
        .farm-list-item {
            cursor: pointer;
            padding: 0.6rem 0.8rem;
            border-radius: 8px;
            transition: background 0.15s;
            border: 1px solid transparent;
        }
        .farm-list-item:hover {
            background: var(--bg-sidebar-hover);
            border-color: var(--border-color);
        }
    </style>
</head>
<body class="d-flex">
<th:block th:replace="~{layout/base :: sidebar}"></th:block>

<div id="main-content" class="flex-grow-1 p-4 overflow-auto">
    <div th:replace="~{layout/base :: alerts}"></div>

    <h2 class="fw-bold mb-2"><i class="bi bi-globe-asia-australia me-2 text-success"></i>Myanmar Farm Network</h2>
    <p class="text-muted mb-4">Interactive regional view — click any farm to inspect details</p>

    <!-- Global Summary Row -->
    <div class="row g-3 mb-4">
        <div class="col-md-3">
            <div class="map-stat-card">
                <div class="text-muted small"><i class="bi bi-house-door me-1"></i>Total Farms</div>
                <div class="fs-4 fw-bold" th:text="${summary.totalFarms}">0</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="map-stat-card">
                <div class="text-muted small"><i class="bi bi-piggy-bank me-1"></i>Total Pigs</div>
                <div class="fs-4 fw-bold" th:text="${summary.totalPigs}">0</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="map-stat-card">
                <div class="text-muted small"><i class="bi bi-people me-1"></i>Staff</div>
                <div class="fs-4 fw-bold" th:text="${summary.totalUsers}">0</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="map-stat-card">
                <div class="text-muted small"><i class="bi bi-buildings me-1"></i>Buildings</div>
                <div class="fs-4 fw-bold" th:text="${summary.totalBuildings}">0</div>
            </div>
        </div>
    </div>

    <!-- Google Maps Iframe + Farm List -->
    <div class="row g-4">
        <div class="col-md-8">
            <div class="glass-card p-3">
                <iframe id="mapFrame"
                        th:src="@{https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d3000000!2d96.2!3d16.87!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e1!3m2!1sen!2smm}"
                        style="border:0;" allowfullscreen="" loading="lazy"
                        referrerpolicy="no-referrer-when-downgrade">
                </iframe>
            </div>
        </div>
        <div class="col-md-4">
            <div class="glass-card p-3">
                <h6 class="fw-bold mb-3"><i class="bi bi-list-ul me-2"></i>Farm Locations</h6>
                <div class="d-flex flex-column gap-2" style="max-height:400px;overflow-y:auto;">
                    <div th:each="farm : ${farms}" class="farm-list-item"
                         th:data-lat="${farm.latitude}" th:data-lng="${farm.longitude}"
                         th:data-name="${farm.name}" th:data-id="${farm.id}"
                         th:data-location="${farm.location}"
                         onclick="focusFarm(this)">
                        <div class="d-flex align-items-center">
                            <i class="bi bi-geo-alt-fill text-success me-2"></i>
                            <div>
                                <div class="fw-semibold small" th:text="${farm.name}"></div>
                                <div class="text-muted" style="font-size:0.7rem;" th:text="${farm.location ?: 'No location set'}"></div>
                            </div>
                        </div>
                    </div>
                    <div th:if="${#lists.isEmpty(farms)}" class="text-muted small text-center py-3">
                        No farms with coordinates found.
                    </div>
                </div>
                <hr/>
                <div class="d-grid gap-2">
                    <a href="https://www.google.com/maps/@16.87,96.20,6z" target="_blank"
                       class="btn btn-outline-success btn-sm">
                        <i class="bi bi-box-arrow-up-right me-1"></i>Open Full Myanmar Map
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Drawer Overlay -->
<div id="drawerOverlay" onclick="closeDrawer()"></div>

<!-- Farm Detail Drawer -->
<div id="farmDrawer">
    <div class="p-3">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h6 class="fw-bold mb-0" id="drawerFarmName">Farm Details</h6>
            <button class="btn btn-sm btn-glass" onclick="closeDrawer()"><i class="bi bi-x-lg"></i></button>
        </div>
        <hr/>
        <div id="drawerContent" class="text-muted small">Loading...</div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
<script>
    function focusFarm(el) {
        var lat = parseFloat(el.dataset.lat);
        var lng = parseFloat(el.dataset.lng);
        var name = el.dataset.name;
        var id = el.dataset.id;
        var location = el.dataset.location || name;

        if (lat && lng) {
            document.getElementById('mapFrame').src =
                'https://www.google.com/maps?q=' + encodeURIComponent(lat + ',' + lng) + '&z=12&output=embed';
        } else if (location) {
            document.getElementById('mapFrame').src =
                'https://www.google.com/maps?q=' + encodeURIComponent(location + ', Myanmar') + '&z=12&output=embed';
        }
        openDrawer(id);
    }

    function openDrawer(farmId) {
        document.getElementById('drawerOverlay').classList.add('open');
        document.getElementById('farmDrawer').classList.add('open');
        document.getElementById('drawerContent').innerHTML = '<div class="text-center py-3"><div class="spinner-border spinner-border-sm text-success"></div></div>';

        fetch('/admin/farms/' + farmId + '/map-detail')
            .then(function(r) { return r.json(); })
            .then(function(data) {
                var loc = data.location || 'Not specified';
                var desc = data.description || 'No description';
                document.getElementById('drawerFarmName').textContent = data.name;
                document.getElementById('drawerContent').innerHTML =
                    '<div class="mb-3">' +
                    '<div class="badge bg-success mb-2">' + data.code + '</div>' +
                    '<div class="text-muted small mb-1"><i class="bi bi-geo-alt me-1"></i>' + loc + '</div>' +
                    '<div class="text-muted small">' + desc + '</div>' +
                    '</div>' +
                    '<div class="row g-2 mb-3">' +
                    '<div class="col-6"><div class="map-stat-card text-center"><div class="fw-bold fs-5">' + data.buildingCount + '</div><div class="text-muted small">Buildings</div></div></div>' +
                    '<div class="col-6"><div class="map-stat-card text-center"><div class="fw-bold fs-5">' + data.staffCount + '</div><div class="text-muted small">Staff</div></div></div>' +
                    '</div>' +
                    '<div class="d-grid gap-2">' +
                    '<a href="/admin/farms/' + data.id + '" class="btn btn-success btn-sm">' +
                    '<i class="bi bi-eye me-1"></i>View Full Profile</a>' +
                    '<a href="/admin/farms/' + data.id + '/edit" class="btn btn-outline-secondary btn-sm">' +
                    '<i class="bi bi-pencil me-1"></i>Edit Farm</a>' +
                    '</div>';
            })
            .catch(function() {
                document.getElementById('drawerContent').innerHTML = '<div class="text-danger">Failed to load details.</div>';
            });
    }

    function closeDrawer() {
        document.getElementById('drawerOverlay').classList.remove('open');
        document.getElementById('farmDrawer').classList.remove('open');
    }

    document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeDrawer(); });
</script>
</body>
</html>
