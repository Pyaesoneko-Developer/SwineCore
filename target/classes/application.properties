spring.application.name=SwineCore

# ---- DataSource ----
spring.datasource.url=jdbc:mysql://localhost:3306/swinecore_testing?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true&zeroDateTimeBehavior=CONVERT_TO_NULL
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

# ---- Thymeleaf ----
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ---- Server ----
server.port=8080
server.error.whitelabel.enabled=false
server.address=0.0.0.0

# ---- File Upload ----
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---- Static Resources ----
spring.web.resources.static-locations=classpath:/static/
app.upload.dir=${user.home}/swinecore-uploads

# ---- Mail ----
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=noreply@swinecore.com

# ---- App ----
app.base-url=http://localhost:8080
# Payment QR codes auto-detect this computer's LAN IPv4 address when blank.
# Override when multiple adapters/VPNs exist, for example:
# SWINECORE_PAYMENT_BASE_URL=http://192.168.1.20:8080
app.payment-base-url=${SWINECORE_PAYMENT_BASE_URL:}
app.qr-secret=${SWINECORE_QR_SECRET:change-this-secret-before-production}
app.password-reset.token-expiry-minutes=60

# ---- Scheduling ----
spring.task.scheduling.pool.size=5

# ---- Logging ----
logging.level.com.example.swinecore=INFO
logging.level.org.springframework.security=WARN
